spring.datasource.username=alexis
spring.datasource.password=True

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- NUEVAS PROPIEDADES PARA GESTIÓN DE ARCHIVOS ---
# Directorio raíz donde se guardarán las fotos en la raíz del proyecto
file.upload-dir=./uploads

# Tamaño máximo permitido por archivo individual (ej. 50MB)
spring.servlet.multipart.max-file-size=50MB

# Tamaño máximo permitido para la petición HTTP completa
spring.servlet.multipart.max-request-size=50MB